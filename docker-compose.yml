version: '3.8'

services:
  postgres:
    image: timescale/timescaledb-ha:pg16
    container_name: ctms-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ctms_dev}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ctms_password}
      POSTGRES_DB: ${POSTGRES_DB:-ctms_db}
      TIMESCALEDB_TELEMETRY: "off"
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ctms_dev} -d ${POSTGRES_DB:-ctms_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - ctms-net

  redis:
    image: redis:7.2-alpine
    container_name: ctms-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-redis_local_pass}
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redis_local_pass}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - ctms-net

  dgraph:
    image: dgraph/standalone:v23.1.0
    container_name: ctms-dgraph
    restart: unless-stopped
    ports:
      - "8080:8080" # GraphQL & HTTP DQL port
      - "9080:9080" # gRPC Ratel & Client port
    volumes:
      - dgraphdata:/dgraph
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ctms-net

  mock-zoho:
    image: python:3.11-alpine
    container_name: ctms-mock-zoho
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ./scripts:/app/scripts:ro
    command: ["python3", "scripts/mock_zoho_server.py"]
    ports:
      - "8089:8089"
    healthcheck:
      test: ["CMD-SHELL", "python3 -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:8089/health\")' || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - ctms-net

volumes:
  pgdata:
  redisdata:
  dgraphdata:

networks:
  ctms-net:
    driver: bridge
